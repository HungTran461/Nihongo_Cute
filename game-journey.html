<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongo Cute - Hành Trình Trợ Từ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           1. KIẾN TRÚC BIẾN & THIẾT LẬP CƠ BẢN
           ========================================= */
        :root {
            --primary: #ff8fa3;
            --primary-hover: #ff758c;
            --primary-shadow: #ff4d6d40;
            --secondary: #a0c4ff;
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            
            --success: #38b000;
            --success-light: #d8f3dc;
            --danger: #e63946;
            --danger-light: #ffe5e5;
            
            --text-main: #2b2d42;
            --text-muted: #8d99ae;
            --surface-glass: rgba(255, 255, 255, 0.75);
            --surface-border: rgba(255, 255, 255, 0.6);
            
            --shadow-soft: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            --shadow-float: 0 20px 40px -10px rgba(255, 143, 163, 0.2);
            --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
            --smooth: cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: 'M PLUS Rounded 1c', sans-serif; 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            background: var(--bg-gradient);
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20.5V18H0v-2h20v-2H0v-2h20v-2H0V8h20V6H0V4h20V2H0V0h22v20h2V0h2v20h2V0h2v20h2V0h2v20h2V0h2v20h2v20H20v-1.5zM0 20h2v20H0V20zm4 0h2v20H4V20zm4 0h2v20H8V20zm4 0h2v20h-2V20zm4 0h2v20h-2V20zm4 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2z' fill='%23ff8fa3' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
            overflow-x: hidden;
        }

        header { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 15px 40px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-bottom: 1px solid var(--surface-border);
            box-shadow: var(--shadow-soft);
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
        .logo span { color: var(--primary); }

        .container { flex: 1; max-width: 960px; margin: 0 auto; padding: 40px 20px; width: 100%; position: relative; }

        .screen { display: none; opacity: 0; transform: scale(0.98) translateY(10px); transition: opacity 0.5s var(--smooth), transform 0.5s var(--smooth); }
        .screen.active { display: block; opacity: 1; transform: scale(1) translateY(0); }

        /* =========================================
           2. MÀN HÌNH BẢN ĐỒ
           ========================================= */
        .header-title { text-align: center; margin-bottom: 50px; }
        .header-title h1 { font-size: 2.8rem; font-weight: 800; color: var(--text-main); margin-bottom: 8px; letter-spacing: -1px; }
        .header-title p { color: var(--text-muted); font-size: 1.2rem; font-weight: 700; }

        .stage-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        
        /* 1. KHÓA ÁNH SÁNG TRÀN ĐỂ MÀN HÌNH KHÔNG BỊ KÉO DÀI */
        .stage-card { 
            background: var(--surface-glass); 
            backdrop-filter: blur(16px);
            border: 1px solid var(--surface-border);
            border-radius: 28px; 
            padding: 30px; 
            box-shadow: var(--shadow-soft); 
            cursor: pointer; 
            transition: all 0.4s var(--bounce); 
            
            position: relative; 
            overflow: hidden; /* QUAN TRỌNG: Cắt bỏ ánh sáng thừa, khóa cứng kích thước thẻ */
            
            display: flex; 
            flex-direction: column;
        }

        /* 2. CHUYỂN HUY HIỆU CLEAR VÀO TRONG ĐỂ KHÔNG BỊ CẮT */
        .clear-badge {
            position: absolute;
            top: 25px;    /* Đẩy huy hiệu xuống bằng mép padding của thẻ */
            right: 25px;  /* Căn sát lề phải siêu gọn gàng */
            background: linear-gradient(135deg, #2ec4b6 0%, #0cb0a3 100%); 
            color: white;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 6px 15px rgba(12, 176, 163, 0.3);
            letter-spacing: 0.5px;
            z-index: 10;
            animation: popInClear 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        .stage-card.is-cleared {
            border-color: #cbf3f0;
            background: linear-gradient(180deg, #ffffff 0%, #f6fdfc 100%);
        }

        .stage-card.is-cleared .stage-num {
            background: #2ec4b6;
            box-shadow: 0 4px 10px rgba(46, 196, 182, 0.25);
        }

        .stage-card.is-cleared:hover {
            border-color: #2ec4b6;
            transform: translateY(-6px);
        }

        @keyframes popInClear {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        /* KẾT THÚC THÊM MỚI CLEAR */
        
        .stage-card::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(to bottom right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(45deg) translateY(-100%); transition: 0.6s; z-index: 1; pointer-events: none;
        }
        .stage-card:hover::after { transform: rotate(45deg) translateY(100%); }
        .stage-card:hover { transform: translateY(-10px); box-shadow: var(--shadow-float); border-color: rgba(255, 143, 163, 0.4); }

        .stage-num { 
            background: linear-gradient(135deg, var(--primary), var(--primary-hover)); 
            color: white; width: 48px; height: 48px; border-radius: 16px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 1.5rem; font-weight: 800; margin-bottom: 20px;
            box-shadow: 0 4px 15px var(--primary-shadow);
        }
        .stage-card h3 { font-size: 1.5rem; margin-bottom: 12px; color: var(--text-main); position: relative; z-index: 2; }
        .stage-card p { color: var(--text-muted); font-size: 1.05rem; line-height: 1.5; margin-bottom: 25px; flex-grow: 1; position: relative; z-index: 2;}
        
        .btn-start { 
            background: transparent; color: var(--primary); border: 2px solid var(--primary); 
            padding: 14px; border-radius: 16px; font-weight: 800; font-size: 1.1rem; width: 100%; 
            cursor: pointer; transition: 0.3s; position: relative; z-index: 2;
        }
        .stage-card:hover .btn-start { background: var(--primary); color: white; }

        /* =========================================
           3. MÀN HÌNH HỌC TẬP & Ô TRỐNG ĐA TƯƠNG TÁC
           ========================================= */
        .game-nav { display: flex; align-items: center; gap: 25px; margin-bottom: 40px; }
        .btn-exit { 
            background: white; border: none; padding: 12px 24px; border-radius: 16px; 
            color: var(--text-muted); font-weight: 800; cursor: pointer; 
            box-shadow: var(--shadow-soft); transition: 0.2s; 
        }
        .btn-exit:hover { background: #f1f5f9; color: var(--danger); transform: scale(1.05); }
        
        .progress-bar { flex: 1; height: 16px; background: rgba(255,255,255,0.6); border-radius: 20px; overflow: hidden; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); border: 1px solid white;}
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), #ffc8dd); border-radius: 20px; transition: width 0.6s var(--bounce); position: relative;}
        .progress-fill::after {
            content:''; position:absolute; top:0; left:0; bottom:0; right:0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        .progress-text { font-weight: 800; font-size: 1.1rem; color: var(--primary-hover); min-width: 50px; text-align: right;}

        .board { 
            background: var(--surface-glass); backdrop-filter: blur(20px); border: 1px solid white;
            border-radius: 32px; padding: 50px 40px; box-shadow: var(--shadow-soft); 
            text-align: center; margin-bottom: 40px; position: relative;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .board.fade-out { opacity: 0; transform: translateY(-10px); }

        .jp-sentence { 
            font-family: 'Shippori Mincho', serif; 
            font-size: 2.4rem; 
            font-weight: 700; 
            color: #1e293b; 
            line-height: 2.4; 
            margin-bottom: 15px; 
            text-align: center;
        }
        .vi-translation { color: #64748b; font-size: 1.25rem; font-weight: 700; }

        .blank { 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 65px; 
            height: 52px;            
            margin: 0 8px; 
            border: 3px dashed #cbd5e1; 
            border-radius: 16px;        
            background: #f8fafc;        
            color: #cbd5e1;             
            font-family: inherit; 
            font-size: inherit; 
            font-weight: inherit; 
            vertical-align: middle; 
            position: relative;
            top: -4px;                  
            transition: all 0.25s ease; 
            cursor: pointer;
        }

        ruby { ruby-position: over; }
        rt {
            font-family: 'M PLUS Rounded 1c', sans-serif; 
            font-size: 0.45em; 
            font-weight: 700;
            color: #64748b; 
            letter-spacing: 1px;
            padding-bottom: 3px;
        }
        
        .blank.active { 
            border-color: var(--primary); 
            border-style: dashed;
            background: #fff0f2;        
            color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 154, 158, 0.2); 
        }
        
        .blank.filled { 
            border-color: var(--success); 
            border-style: solid;        
            background: #f0fdf4;        
            color: #000000;             
        }
        .blank.filled-user { background: rgba(160, 196, 255, 0.15); border-color: var(--secondary); border-style: solid; color: var(--text-main); }
        
        .blank.correct { background: var(--success-light); border-color: var(--success); border-style: solid; color: var(--success); transform: scale(1.05); }
        .blank.error { 
            border-color: var(--danger); 
            border-style: solid;
            background: #fef2f2;        
            color: var(--danger); 
            animation: shake 0.4s; 
        }

        .options-tray { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-bottom: 30px;}
        .opt-btn { 
            background: white; border: 2px solid #e2e8f0; border-bottom-width: 8px; 
            border-radius: 20px; padding: 18px 36px; font-size: 1.6rem; 
            font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; color: var(--text-main); 
            cursor: pointer; transition: all 0.15s ease; min-width: 120px;
        }
        .opt-btn:hover { border-color: var(--primary); color: var(--primary-hover); transform: translateY(-3px); border-bottom-width: 11px; }
        .opt-btn:active { transform: translateY(6px); border-bottom-width: 2px; background: #fff0f2; }

        .action-container { text-align: center; margin-top: 25px; }
        .btn-next-action {
            background: linear-gradient(135deg, #ff758c 0%, #ff7ea5 100%);
            color: white; border: none; border-bottom: 6px solid #d94e67;
            border-radius: 22px; padding: 18px 80px; font-size: 1.4rem; font-weight: 800;
            cursor: pointer; transition: all 0.15s ease; box-shadow: 0 10px 25px var(--primary-shadow);
            display: inline-flex; align-items: center; gap: 10px;
        }
        .btn-next-action:hover { transform: translateY(-2px); border-bottom-width: 8px; box-shadow: 0 15px 30px var(--primary-shadow); }
        .btn-next-action:active { transform: translateY(4px); border-bottom-width: 2px; }
        .btn-next-action.disabled { background: #cbd5e1; border-bottom: 6px solid #a4b0be; color: #94a3b8; cursor: not-allowed; box-shadow: none; pointer-events: none; }

        /* =========================================
           4. MODALS & PHÁO HOA
           ========================================= */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); 
            display: flex; justify-content: center; align-items: center; 
            z-index: 1000; opacity: 0; visibility: hidden; transition: 0.4s; 
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal-box { 
            background: white; padding: 50px 40px; border-radius: 32px; max-width: 480px; width: 90%; 
            text-align: center; transform: translateY(50px) scale(0.9); transition: 0.5s var(--bounce); 
            box-shadow: 0 40px 80px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2);
        }
        .modal-overlay.active .modal-box { transform: translateY(0) scale(1); }
        
        .modal-icon { 
            width: 90px; height: 90px; margin: 0 auto 25px; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; font-size: 3rem; color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .icon-success { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); animation: popIn 0.6s var(--bounce); }
        .icon-error { background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); animation: shakeError 0.6s var(--bounce); }
        .icon-trophy { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); font-size: 3.5rem; animation: floatTrophy 3s ease-in-out infinite; }

        .modal-title { font-size: 2rem; font-weight: 800; margin-bottom: 15px; }
        .modal-desc { 
            color: var(--text-main); line-height: 1.7; font-size: 1.1rem; margin-bottom: 30px; 
            background: #f8fafc; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; text-align: left; 
        }
        
        .btn-modal { 
            width: 100%; padding: 18px; border-radius: 20px; border: none; font-size: 1.25rem; 
            font-weight: 800; color: white; cursor: pointer; transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .btn-modal:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0,0,0,0.2); }
        .btn-modal.success { background: var(--success); }
        .btn-modal.error { background: var(--danger); }
        .btn-modal.trophy { background: linear-gradient(135deg, var(--primary) 0%, #ffc8dd 100%); color: var(--text-main);}

        @keyframes shakeError { 0%, 100% {transform: translateX(0);} 20% {transform: translateX(-10px);} 40% {transform: translateX(10px);} 60% {transform: translateX(-5px);} 80% {transform: translateX(5px);} }
        @keyframes popIn { 0% {transform: scale(0.5); opacity: 0;} 100% {transform: scale(1); opacity: 1;} }
        @keyframes floatTrophy { 0%, 100% {transform: translateY(0);} 50% {transform: translateY(-15px);} }

        #confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
        .confetti-piece { position: absolute; width: 10px; height: 20px; background: #ffd300; animation: fall 3s linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">Nihongo<span>Cute</span></div>
    </header>

    <div class="container">
        <div id="confetti-container"></div>

        <div id="screen-map" class="screen active">
            <div class="header-title">
                <h1>Hành Trình Trợ Từ</h1>
                <p>Khám phá chiều sâu ngữ pháp Nhật Bản</p>
            </div>
            <div class="stage-grid" id="stage-container"></div>
        </div>

        <div id="screen-game" class="screen">
            <div class="game-nav">
                <button class="btn-exit" onclick="backToMap()">Thoát</button>
                <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
                <div class="progress-text" id="progress-text">0/0</div>
            </div>

            <div class="board" id="board-container">
                <div class="jp-sentence" id="question-text"></div>
                <div class="vi-translation" id="translation-text"></div>
            </div>

            <div class="options-tray" id="options-container"></div>

            <div class="action-container">
                <button class="btn-next-action disabled" id="btn-next" onclick="validateCurrentQuestion()">
                    KIỂM TRA ĐÁP ÁN ➔
                </button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-feedback">
        <div class="modal-box">
            <div class="modal-icon" id="fb-icon"></div>
            <h2 class="modal-title" id="fb-title"></h2>
            <div class="modal-desc" id="fb-desc"></div>
            <button class="btn-modal" id="fb-btn" onclick="nextAction()"></button>
        </div>
    </div>

    <div class="modal-overlay" id="modal-complete">
        <div class="modal-box">
            <div class="modal-icon icon-trophy">🏆</div>
            <h2 class="modal-title" style="color: #d97706;">Hoàn Thành Xuất Sắc!</h2>
            <div class="modal-desc" style="text-align: center; border: none; background: transparent; font-size: 1.2rem;">
                Tuyệt vời! Bạn đã chinh phục hoàn toàn trạm này.
            </div>
            <button class="btn-modal trophy" onclick="backToMap()">Trở về Bản Đồ</button>
        </div>
    </div>

    <script src="game-journey-logic.js"></script>
</body>
</html>
